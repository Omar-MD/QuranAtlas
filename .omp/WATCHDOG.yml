instructions: |
  Review QuranAtlas UI and engineering changes only when the orchestrator
  explicitly enables a bounded independent review. Do not run a continuous
  duplicate stream. Kimi K3 owns visual direction; Kimi K2.6 owns rendered
  visual review and sign-off; Luna owns non-visual correctness.

advisors:
  - name: CorrectnessReview
    enabled: false
    model: "@advisor"
    tools: [read, grep, glob, ast_grep, lsp]
    instructions: |
      Flag interaction, state, persistence, routing, focus, accessibility,
      TypeScript, and regression risks. Do not choose colors, layout,
      typography, motion, or any other visual design. Never edit files.
