modelRoleStorage: project
defaultThinkingLevel: high
disabledProviders:
  - opencode-go
  - opencode-zen
  - openrouter
modelRoles:
  default: kimi-code/k3-256k:high
  task: kimi-code/kimi-for-coding:high
  plan: kimi-code/k3-256k:max
  implement_complex: kimi-code/k3-256k:max
  advisor: openai-codex/gpt-5.6-luna:high
  slow: kimi-code/k3-256k:max
  vision: kimi-code/kimi-k2.5:high
  smol: openai-codex/gpt-5.6-luna:low
  commit: openai-codex/gpt-5.6-luna:low
  tiny: openai-codex/gpt-5.6-luna:low
  ui_director: kimi-code/k3-256k:high
  ui_implementer: kimi-code/kimi-for-coding:high
  ui_visual: kimi-code/k3-256k:high
  ui_correctness: openai-codex/gpt-5.6-luna:high
  review: kimi-code/k3-256k:high
  test: openai-codex/gpt-5.6-luna:high
  research: openai-codex/gpt-5.6-luna:low
plan:
  defaultOnStartup: false
advisor:
  enabled: false
  syncBacklog: "off"
prewalk:
  enabled: false
lsp:
  enabled: true
  lazy: true
  shared: true
  formatOnWrite: false
  diagnosticsOnWrite: true
  diagnosticsOnEdit: true
  diagnosticsDeduplicate: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
security:
  enabled: true
secrets:
  enabled: true
memory:
  backend: "off"
autolearn:
  enabled: false
  autoContinue: false
task:
  enableLsp: true
  enableEffort: false
  maxConcurrency: 3
  maxRecursionDepth: 1
  prewalk: false
  showResolvedModelBadge: true
  agentModelOverrides:
    task: "@task"
    scout: "@research"
    reviewer: "@review"
    security-reviewer: "@review"
    sonic: "@smol"
  agentAdvisor:
    task: "off"
    scout: "off"
    reviewer: "off"
    security-reviewer: "off"
    sonic: "off"
    general-planner: "off"
    ui-director: "off"
    ui-implementer: "off"
    ui-visual-reviewer: "off"
    ui-correctness-reviewer: "off"
retry:
  enabled: true
  maxRetries: 3
  modelFallback: true
  fallbackRevertPolicy: cooldown-expiry
  usageAwareFallback: true
  usageReservePct: 10
  usageReservePolicy: auto
  fallbackChains:
    default:
      - kimi-code/k3-256k:high
    plan:
      - kimi-code/k3-256k:max
    task:
      - kimi-code/kimi-for-coding:high
    implement_complex:
      - kimi-code/k3-256k:max
    advisor:
      - kimi-code/k3-256k:high
    slow:
      - kimi-code/k3:max
    vision:
      - kimi-code/k3-256k:high
    smol:
      - kimi-code/kimi-for-coding:low
    tiny:
      - kimi-code/kimi-for-coding:low
    commit:
      - kimi-code/kimi-for-coding:low
    ui_director:
      - kimi-code/k3-256k:max
    ui_implementer:
      - kimi-code/k3-256k:high
    ui_visual:
      - kimi-code/kimi-k2.5:high
    ui_correctness:
      - kimi-code/k3-256k:high
    review:
      - openai-codex/gpt-5.6-luna:high
    test:
      - kimi-code/kimi-for-coding:high
    research:
      - kimi-code/kimi-for-coding:low
providers:
  openai-codex:
    codeMode: "off"