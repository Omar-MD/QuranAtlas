# .omp/ — project harness config. The main session is a bounded Luna
# orchestrator; worker roles own planning, implementation, and review.

modelRoleStorage: project
defaultThinkingLevel: medium
disabledProviders:
  - opencode-zen

modelRoles:
  default: openai-codex/gpt-5.6-luna:medium
  task: openai-codex/gpt-5.6-luna:medium
  plan: zai/glm-5.3:max
  advisor: openai-codex/gpt-5.6-luna:high
  slow: openai-codex/gpt-5.6-luna:high
  vision: zai/glm-5.3-flash:low
  smol: zai/glm-5.3-flash:low
  commit: zai/glm-5.3-flash:low
  tiny: zai/glm-5.3-flash:low
  ui_director: opencode-go/kimi-k3:high
  ui_visual: opencode-go/kimi-k2.6
  ui_correctness: openai-codex/gpt-5.6-luna:high

plan:
  defaultOnStartup: false

advisor:
  enabled: false
  syncBacklog: "off"

prewalk:
  enabled: false

lsp:
  enabled: true
  lazy: true
  shared: true
  formatOnWrite: false
  diagnosticsOnWrite: true
  diagnosticsOnEdit: true
  diagnosticsDeduplicate: true

astGrep:
  enabled: true

checkpoint:
  enabled: true

github:
  enabled: true

security:
  enabled: true

secrets:
  enabled: true

memory:
  backend: off

autolearn:
  enabled: false
  autoContinue: false

task:
  enableLsp: true
  enableEffort: false
  maxConcurrency: 4
  maxRecursionDepth: 1
  prewalk: false
  showResolvedModelBadge: true
  agentModelOverrides:
    task: "@task"
    scout: "@task"
    reviewer: "@ui_correctness"
    security-reviewer: "@ui_correctness"
    sonic: "@smol"
  agentAdvisor:
    task: "off"
    scout: "off"
    reviewer: "off"
    security-reviewer: "off"
    sonic: "off"
    general-planner: "off"
    ui-director: "off"
    ui-implementer: "off"
    ui-visual-reviewer: "off"
    ui-correctness-reviewer: "off"

retry:
  maxRetries: 3
  modelFallback: true
  # Kimi seats run on OpenCode Go for now (OpenRouter key not configured).
  # These chains restore OpenRouter as primary the moment it is
  # authenticated: flip ui_director/ui_visual back and the failing-model
  # fallback below engages on any OpenRouter outage.
  fallbackChains:
    openrouter/moonshotai/kimi-k3: opencode-go/kimi-k3
    openrouter/moonshotai/kimi-k2.6: opencode-go/kimi-k2.6

providers:
  openai-codex:
    codeMode: off
