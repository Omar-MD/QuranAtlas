# .omp/ — project harness config. The main session is a bounded
# orchestrator (`default` role); worker roles own planning, implementation,
# and review.

modelRoleStorage: project
defaultThinkingLevel: max
disabledProviders:
  - opencode-zen

# modelRoles is the single source of truth for the model roster. Every
# other document (AGENTS.md, WATCHDOG, skills, agents) refers to roles
# only — never restate model IDs elsewhere.
modelRoles:
  default: zai/glm-5.3:max                         # main-session orchestrator
  task: zai/glm-5.3:max                            # generic workers
  plan: zai/glm-5.3:max                          # general planning (general-planner)
  advisor: openai-codex/gpt-5.6-luna:max         # bounded independent review
  slow: openai-codex/gpt-5.6-luna:max            # difficult engineering review / escalation
  vision: zai/glm-5.3-flash:max                  # image/screenshot inspection
  smol: zai/glm-5.3-flash:low                    # fast mechanical work (sonic)
  commit: zai/glm-5.3-flash:low                  # commit messages
  tiny: zai/glm-5.3-flash:low                    # titles and misc
  ui_director: openrouter/moonshotai/kimi-k3:max       # design briefs (ui-director)
  ui_implementer: zai/glm-5.3-flash:max          # implementation/repair (ui-implementer)
  ui_visual: openrouter/moonshotai/kimi-k2.6:xhigh   # visual review (ui-visual-reviewer)
  ui_correctness: openai-codex/gpt-5.6-luna:max       # correctness (ui-correctness-reviewer)

plan:
  defaultOnStartup: false

advisor:
  enabled: false
  syncBacklog: "off"

prewalk:
  enabled: false

lsp:
  enabled: true
  lazy: true
  shared: true
  formatOnWrite: false
  diagnosticsOnWrite: true
  diagnosticsOnEdit: true
  diagnosticsDeduplicate: true

astGrep:
  enabled: true

checkpoint:
  enabled: true

github:
  enabled: true

security:
  enabled: true

secrets:
  enabled: true

memory:
  backend: off

autolearn:
  enabled: false
  autoContinue: false

task:
  enableLsp: true
  enableEffort: false
  maxConcurrency: 4
  maxRecursionDepth: 1
  prewalk: false
  showResolvedModelBadge: true
  agentModelOverrides:
    task: "@task"
    scout: "@task"
    reviewer: "@ui_correctness"
    security-reviewer: "@ui_correctness"
    sonic: "@smol"
  agentAdvisor:
    task: "off"
    scout: "off"
    reviewer: "off"
    security-reviewer: "off"
    sonic: "off"
    general-planner: "off"
    ui-director: "off"
    ui-implementer: "off"
    ui-visual-reviewer: "off"
    ui-correctness-reviewer: "off"

retry:
  maxRetries: 3
  modelFallback: true
  # The design/visual seats run on OpenRouter; on any OpenRouter outage the
  # chains below fail over to OpenCode Go instead of silently degrading.
  # Both OpenRouter slugs are pinned to native-or-lossless endpoints via
  # ~/.omp/agent/models.yml (K3: mxfp4-native/bf16; K2.6: int4-native/bf16
  # — both models ship natively 4-bit, so the guarantee is "never
  # re-quantized below the official checkpoint"): re-encoded
  # fp4/nvfp4/int4/fp8 endpoints and unverifiable ones are never used; when
  # no eligible endpoint is up, requests fail over to the chains below.
  # The models.yml pinning is machine-local and untracked: if that file is
  # lost, re-create its native-or-lossless filters before relying on the
  # OpenRouter seats.
  #
  # Both key spellings for each Kimi slug are deliberate: effort-suffix
  # matching is undocumented, so the bare and suffixed keys share one value
  # to cover exact and normalized lookups alike (keeping each failover at
  # the seat's max effort: k3 → :max, k2.6 → :xhigh).
  fallbackChains:
    openrouter/moonshotai/kimi-k3: opencode-go/kimi-k3:max
    openrouter/moonshotai/kimi-k3:max: opencode-go/kimi-k3:max
    openrouter/moonshotai/kimi-k2.6: opencode-go/kimi-k2.6:xhigh
    openrouter/moonshotai/kimi-k2.6:xhigh: opencode-go/kimi-k2.6:xhigh

providers:
  openai-codex:
    codeMode: off
