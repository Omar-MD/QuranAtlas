modelRoleStorage: project
defaultThinkingLevel: max
disabledProviders:
  - opencode-zen
modelRoles:
  default: zai/glm-5.3:max
  task: zai/glm-5.3:max
  plan: zai/glm-5.3:max
  advisor: openai-codex/gpt-5.6-luna:max
  slow: openai-codex/gpt-5.6-luna:max
  vision: zai/glm-5.3-flash:max
  smol: zai/glm-5.3-flash:low
  commit: zai/glm-5.3-flash:low
  tiny: zai/glm-5.3-flash:low
  ui_director: opencode-go/kimi-k3:max
  ui_implementer: zai/glm-5.3-flash:max
  ui_visual: opencode-go/kimi-k2.6:xhigh
  ui_correctness: zai/glm-5.3-flash:high
plan:
  defaultOnStartup: false
advisor:
  enabled: true
  syncBacklog: "off"
prewalk:
  enabled: false
lsp:
  enabled: true
  lazy: true
  shared: true
  formatOnWrite: false
  diagnosticsOnWrite: true
  diagnosticsOnEdit: true
  diagnosticsDeduplicate: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
security:
  enabled: true
secrets:
  enabled: true
memory:
  backend: "off"
autolearn:
  enabled: false
  autoContinue: false
task:
  enableLsp: true
  enableEffort: false
  maxConcurrency: 4
  maxRecursionDepth: 1
  prewalk: false
  showResolvedModelBadge: true
  agentModelOverrides:
    task: "@task"
    scout: "@task"
    reviewer: "@slow"
    security-reviewer: "@slow"
    sonic: "@smol"
  agentAdvisor:
    task: "off"
    scout: "off"
    reviewer: "off"
    security-reviewer: "off"
    sonic: "off"
    general-planner: "off"
    ui-director: "off"
    ui-implementer: "off"
    ui-visual-reviewer: "off"
    ui-correctness-reviewer: "off"
retry:
  maxRetries: 3
  modelFallback: true
  fallbackChains:
    opencode-go/kimi-k3:
      - openrouter/moonshotai/kimi-k3:max
    opencode-go/kimi-k3:max:
      - openrouter/moonshotai/kimi-k3:max
    opencode-go/kimi-k2.6:
      - openrouter/moonshotai/kimi-k2.6:xhigh
    opencode-go/kimi-k2.6:xhigh:
      - openrouter/moonshotai/kimi-k2.6:xhigh
providers:
  openai-codex:
    codeMode: "off"