name: 'Setup mise toolchain + dependencies'
description: 'Install mise-managed tools (Node and pnpm) from mise.toml and project dependencies.'

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@04d84180cbc2565be119d8d6191515a6983c5fde # main as of 2026-09-01; runs mise install
      with:
        install: 'true'
        cache: 'true'

    - name: Install dependencies
      shell: bash
      run: mise run install
