name: 'Setup pnpm + Node.js + deps'
description: 'Install pnpm, Node.js, and restore dependencies from cache. Keyed by pnpm-lock.yaml.'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 10.31.0

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
