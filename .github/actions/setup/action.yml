name: 'Setup mise toolchain + dependencies'
description: 'Install mise-managed tools (Node and pnpm) from mise.toml and project dependencies.'

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@cc67a941c2b62499fed094d478d5e7e1f40e7d2f # main as of 2026-09-01; runs mise install
      with:
        install: 'true'
        cache: 'true'

    - name: Install dependencies
      shell: bash
      run: mise run install
