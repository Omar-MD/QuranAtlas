name: 'Setup pnpm + Node.js + deps'
description: 'Install pnpm, Node.js, and restore dependencies from cache. Keyed by pnpm-lock.yaml.'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
      with:
        version: 10.31.0

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
