name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

# Only the latest CI run per branch/PR matters — cancel older in-flight runs
# when a new push lands. github.ref is the pushed branch on push events and
# refs/pull/N/merge on PR events, so one group per logical unit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Explicit least-privilege for GITHUB_TOKEN. CI only reads source; it never
# writes issues, releases, commits, or packages. Belt-and-suspenders against
# repo-level default changes.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      e2e_relevant: ${{ steps.filter.outputs.e2e_relevant }}
      dataset_relevant: ${{ steps.filter.outputs.dataset_relevant }}
      reason: ${{ steps.filter.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: filter
        env:
          # All untrusted inputs are surfaced via env (not interpolated into
          # the run: body) to avoid command-injection vectors.
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi

          # New branch / first push / empty base — run e2e (no baseline).
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "e2e_relevant=true" >> "$GITHUB_OUTPUT"
            echo "dataset_relevant=true" >> "$GITHUB_OUTPUT"
            echo "reason=no-baseline" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
          if [ -z "$CHANGED" ]; then
            echo "e2e_relevant=false" >> "$GITHUB_OUTPUT"
            echo "dataset_relevant=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-files-changed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'

          # E2E-IRRELEVANT paths — any change that lands ENTIRELY inside
          # this list skips the Playwright suite. Everything else runs e2e:
          # source, styles, public assets, vite/playwright config, lockfile.
          #
          #   docs/**          — context docs, journeys, future-work
          #   tests/unit/**    — unit suite runs in its own job
          #   scripts/**       — build/dataset scripts (Build job covers impact)
          #   *.md             — root-level READMEs / changelogs
          #   .github/**/*.md  — issue / PR templates
          #   LICENSE / .gitignore / .editorconfig — meta-only
          RELEVANT=$(echo "$CHANGED" | grep -vE \
            -e '^docs/' \
            -e '^tests/unit/' \
            -e '^scripts/' \
            -e '\.md$' \
            -e '^LICENSE$' \
            -e '^\.gitignore$' \
            -e '^\.editorconfig$' \
            -e '^\.github/.*\.md$' \
            || true)

          if [ -z "$RELEVANT" ]; then
            echo "e2e_relevant=false" >> "$GITHUB_OUTPUT"
            echo "reason=docs-or-unit-only" >> "$GITHUB_OUTPUT"
          else
            echo "e2e_relevant=true" >> "$GITHUB_OUTPUT"
            FIRST=$(echo "$RELEVANT" | head -1)
            echo "reason=changed:${FIRST}" >> "$GITHUB_OUTPUT"
          fi

          DATASET_RELEVANT=$(echo "$CHANGED" | grep -E \
            -e '^data/catalog/' \
            -e '^data/normalized/' \
            -e '^scripts/data/' \
            -e '^public/dataset/' \
            -e '^package\.json$' \
            -e '^pnpm-lock\.yaml$' \
            || true)
          if [ -z "$DATASET_RELEVANT" ]; then
            echo "dataset_relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "dataset_relevant=true" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run lint

  typecheck:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run test

  feature-state:
    name: Feature-State Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: node scripts/check-no-feature-state.js

  docs-check:
    name: Docs Derive Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run docs:check

  dataset-catalog:
    name: Dataset Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run data -- check

  dataset-baseline:
    name: Dataset Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run data -- build

  dataset-full:
    name: Dataset Full
    needs: changes
    if: >
      github.event_name == 'push' ||
      needs.changes.outputs.dataset_relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run data -- build --profile=full


  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level moderate

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: dist/
          retention-days: 7
          if-no-files-found: error

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: dist/
      - run: pnpm exec lhci autorun --config=.lighthouserc.cjs
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  e2e:
    name: E2E (Playwright)
    # Two skip gates:
    #
    #   1. **Path filter** — `changes.e2e_relevant=false` means the diff is
    #      entirely docs / unit tests / scripts / *.md (no UI, source, asset,
    #      config, or e2e-spec changes). Skip — the unit + lint + build jobs
    #      already cover that scope. Force a run by including any file outside
    #      the irrelevant list, or by applying `run-e2e` to the PR.
    #
    #   2. **PR-to-dev fast lane** — PRs targeting `dev` skip e2e for fast
    #      feature iteration; it re-runs on the push to `dev` after merge,
    #      and on every PR/push to `staging` + `main`. Override per-PR via
    #      the `run-e2e` label.
    if: >
      (needs.changes.outputs.e2e_relevant == 'true') &&
      (
        !(github.event_name == 'pull_request' && github.base_ref == 'dev') ||
        contains(github.event.pull_request.labels.*.name, 'run-e2e')
      )
    # Reuse the dist/ artifact from the Build job so Playwright runs against
    # a preview server (statically served prod bundle) rather than the dev
    # server. The dev-server path is too slow under workers=6 on 2-core CI:
    # vite's on-demand compilation queues up across workers and pushes the
    # 25s waitForReader timeout (every test fails at .qa-verse not visible).
    # Preview removes the compile path entirely; one build, many readers.
    needs: [build, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: dist/

      # Playwright browser binaries (~300 MB for chromium) are expensive to
      # download. Cache them keyed by the lockfile — when @playwright/test
      # upgrades, pnpm-lock.yaml changes and the cache key rotates.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers (skipped on cache hit)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # CI runs against the repo's Playwright script and narrows the project
      # list here so the offline-preview coverage stays included without
      # forcing any local-only project variants.
      - name: Run Playwright suite (non-visual)
        run: pnpm test:e2e --project=chromium --project="Mobile Chrome" --project="Offline (Preview)"
        env:
          PLAYWRIGHT_INCLUDE_OFFLINE: '1'
          PLAYWRIGHT_USE_PREVIEW: '1'
          PLAYWRIGHT_SKIP_BUILD: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-output/report/
            test-output/traces/
          retention-days: 7
          if-no-files-found: warn

  ci-ok:
    name: CI OK
    needs: [changes, lint, typecheck, test, feature-state, docs-check, audit, build, lighthouse, e2e]
    # Run even when e2e is skipped (PRs to dev without the run-e2e label).
    # `always()` lets this job evaluate needs.* results; the step body then
    # fails if any upstream job failed or was cancelled.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          if printf '%s' "$NEEDS_JSON" | jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' > /dev/null; then
            echo "All required CI gates passed (skipped jobs are allowed)."
          else
            echo "::error::One or more required CI gates failed or were cancelled."
            exit 1
          fi
