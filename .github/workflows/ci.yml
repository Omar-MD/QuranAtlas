name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── Flag: add [full-ci] to your commit message (push) or PR title (PR) ──────
# Default (no flag): lint + format check + unit tests + build + chunk check.
# [full-ci]:         also runs e2e → lighthouse → deploy.

jobs:
  # ─── Detect [full-ci] flag (runs in parallel with lint-and-test) ───────────
  check-flags:
    name: Check CI flags
    runs-on: ubuntu-latest
    outputs:
      full_ci: ${{ steps.flags.outputs.full_ci }}
    steps:
      - name: Parse flags from commit message or PR title
        id: flags
        env:
          # For pull_request events use the PR title; for push use the head commit message.
          # Both are set via env to ensure safe handling of multiline/special characters.
          MSG: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}
        run: |
          if echo "$MSG" | grep -qF '[full-ci]'; then
            echo "full_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_ci=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── Job 1: Lint + Unit Tests (always runs) ────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests with coverage
        run: npm run test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ─── Job 2: Build + chunk check ───────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check chunk sizes (≤ 150 KB gzip each)
        run: npm run check:chunks

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── Job 3: E2E Tests [full-ci] ────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [check-flags, build]
    if: needs.check-flags.outputs.full_ci == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps only (cached browsers)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ─── Job 4: Lighthouse [full-ci] ───────────────────────────────────────────
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [check-flags, build]
    if: needs.check-flags.outputs.full_ci == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run Lighthouse CI
        run: |
          npx vite preview --port 4173 &
          sleep 3
          npx lhci autorun --config=lighthouserc.json

  # ─── Job 5: Deploy [full-ci] + push to main only ───────────────────────────
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [check-flags, e2e, lighthouse]
    if: needs.check-flags.outputs.full_ci == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: quran-atlas
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
