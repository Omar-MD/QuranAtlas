name: CI

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]

# Only the latest CI run per branch/PR matters — cancel older in-flight runs
# when a new push lands. github.ref is the pushed branch on push events and
# refs/pull/N/merge on PR events, so one group per logical unit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Explicit least-privilege for GITHUB_TOKEN. CI only reads source; it never
# writes issues, releases, commits, or packages. Belt-and-suspenders against
# repo-level default changes.
permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      build_relevant: ${{ steps.filter.outputs.build_relevant }}
      e2e_relevant: ${{ steps.filter.outputs.e2e_relevant }}
      dataset_relevant: ${{ steps.filter.outputs.dataset_relevant }}
      full_dataset_relevant: ${{ steps.filter.outputs.full_dataset_relevant }}
      mushaf_pages_relevant: ${{ steps.filter.outputs.mushaf_pages_relevant }}
      mushaf_profile: ${{ steps.filter.outputs.mushaf_profile }}
      private_mushaf: ${{ steps.filter.outputs.private_mushaf }}
      reason: ${{ steps.filter.outputs.reason }}
      storybook_relevant: ${{ steps.filter.outputs.storybook_relevant }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: filter
        env:
          # All untrusted inputs are surfaced via env (not interpolated into
          # the run: body) to avoid command-injection vectors.
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
            HEAD="$PR_HEAD_SHA"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_AFTER"
          fi
          node scripts/ci/affected.mjs --base "$BASE" --head "$HEAD" --github-output "$GITHUB_OUTPUT"

  lint:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run test

  docs-check:
    name: Docs Derive Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run docs:check

  dataset-catalog:
    name: Dataset Check
    needs: changes
    if: needs.changes.outputs.dataset_relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run data -- check

  dataset-baseline:
    name: Dataset Baseline
    needs: changes
    if: needs.changes.outputs.dataset_relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run data -- build

  dataset-full:
    name: Dataset Full
    needs: changes
    if: needs.changes.outputs.full_dataset_relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm run data -- build --profile=full


  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level moderate

  build:
    name: Build
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - name: Read private Mushaf distribution
        id: private-distribution
        if: needs.changes.outputs.private_mushaf == 'true'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const path = 'data/catalog/mushaf-editions/qalun-furatiyyah-2023-v1/distribution.json'
          const distribution = JSON.parse(readFileSync(path, 'utf8'))
          for (const [key, value] of Object.entries({
            archive_sha256: distribution.archiveSha256,
            asset_name: distribution.assetName,
            release_tag: distribution.releaseTag,
            repository: distribution.repository,
          })) appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`)
          NODE
      - name: Cache private Mushaf normalized edition
        id: private-mushaf-cache
        if: needs.changes.outputs.private_mushaf == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: data/normalized/mushaf-pages/qaloon/qalun-furatiyyah-2023-v1
          key: ${{ steps.private-distribution.outputs.archive_sha256 }}
      - name: Cache Mushaf page import artifacts
        if: needs.changes.outputs.private_mushaf == 'true' || needs.changes.outputs.mushaf_pages_relevant == 'true' || needs.changes.outputs.e2e_relevant == 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .scratch/mushaf-pages/pdfs/qaloon
            data/normalized/mushaf-pages/qaloon/qalun-quran-ws-v1/pages
          key: mushaf-pages-qaloon-v2-${{ runner.os }}-${{ hashFiles('data/catalog/mushaf-pages.json', 'data/catalog/mushaf-assets.json', 'data/normalized/quran/riwayat/qaloon.json', 'scripts/data/mushaf-pages/import.mjs', 'scripts/data/mushaf-pages/build.mjs') }}
      - name: Install Mushaf page tools
        if: needs.changes.outputs.private_mushaf == 'true' || needs.changes.outputs.mushaf_pages_relevant == 'true' || needs.changes.outputs.e2e_relevant == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils webp
      - name: Restore private Mushaf release archive
        if: needs.changes.outputs.private_mushaf == 'true' && steps.private-mushaf-cache.outputs.cache-hit != 'true'
        env:
          ASSET_NAME: ${{ steps.private-distribution.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.private-distribution.outputs.release_tag }}
          RELEASE_REPOSITORY: ${{ steps.private-distribution.outputs.repository }}
        run: |
          mkdir -p .scratch/releases
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --pattern "$ASSET_NAME" --dir .scratch/releases
          pnpm run data -- mushaf-pages restore-release --archive="$PWD/.scratch/releases/$ASSET_NAME"
      - name: Validate private Mushaf normalized release
        if: needs.changes.outputs.private_mushaf == 'true'
        run: pnpm run data -- mushaf-pages restore-release --check
      # Playwright asserts real Mushaf SVG pages, so any E2E-selected run must
      # upload a dist artifact with the page pack even when source data did not change.
      - name: Generate baseline release Mushaf page pack
        if: needs.changes.outputs.private_mushaf != 'true' && (needs.changes.outputs.mushaf_pages_relevant == 'true' || needs.changes.outputs.e2e_relevant == 'true')
        run: |
          pnpm run data -- mushaf-pages import --riwayah=qaloon --pages=1-604
          pnpm run data -- mushaf-pages build --profile="${{ needs.changes.outputs.mushaf_profile }}" --require-riwayah=qaloon
      - name: Generate private release Mushaf page pack
        if: needs.changes.outputs.private_mushaf == 'true'
        run: |
          pnpm run data -- mushaf-pages import --riwayah=qaloon --pages=1-604
          pnpm run data -- mushaf-pages build --profile="${{ needs.changes.outputs.mushaf_profile }}"
      - name: Build production artifact
        run: pnpm run ci:build
        env:
          QURANATLAS_DATASET_RELEVANT: ${{ needs.changes.outputs.dataset_relevant }}
          QURANATLAS_DATASET_PROFILE: ${{ needs.changes.outputs.mushaf_profile }}
          QURANATLAS_MUSHAF_PAGES_RELEVANT: ${{ needs.changes.outputs.private_mushaf == 'true' || needs.changes.outputs.mushaf_pages_relevant == 'true' || needs.changes.outputs.e2e_relevant == 'true' }}
          QURANATLAS_MUSHAF_PAGES_PREBUILT: ${{ needs.changes.outputs.private_mushaf == 'true' || needs.changes.outputs.mushaf_pages_relevant == 'true' || needs.changes.outputs.e2e_relevant == 'true' }}
      - name: Check final private release Mushaf page pack
        if: needs.changes.outputs.private_mushaf == 'true'
        run: pnpm run data -- mushaf-pages build --profile="${{ needs.changes.outputs.mushaf_profile }}" --check
      - name: Check chunk budget
        run: node scripts/check-chunks.js
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-output
          path: dist/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  lighthouse:
    name: Lighthouse CI
    needs: [build, changes]
    if: needs.changes.outputs.build_relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: dist/
      - run: pnpm exec lhci autorun --config=.lighthouserc.cjs
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  e2e:
    name: E2E (Playwright)
    # Two skip gates:
    #
    #   1. **Path filter** — `changes.e2e_relevant=false` means the diff is
    #      entirely docs / unit tests / scripts / *.md (no UI, source, asset,
    #      config, or e2e-spec changes). Skip — the unit + check + build jobs
    #      already cover that scope. Force a run by including any file outside
    #      the irrelevant list, or by applying `run-e2e` to the PR.
    #
    #   2. **PR-to-dev fast lane** — PRs targeting `dev` skip e2e for fast
    #      feature iteration; it re-runs on the push to `dev` after merge,
    #      and on every PR/push to `staging` + `main`. Override per-PR via
    #      the `run-e2e` label.
    if: >
      (needs.changes.outputs.private_mushaf == 'true' || needs.changes.outputs.e2e_relevant == 'true') &&
      (
        !(github.event_name == 'pull_request' && github.base_ref == 'dev') ||
        contains(github.event.pull_request.labels.*.name, 'run-e2e')
      )
    # Reuse the dist/ artifact from the Build job so Playwright runs against
    # a preview server (statically served prod bundle) rather than the dev
    # server. Preview removes the dev-server compile path entirely; one build,
    # many readers.
    needs: [build, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QURANATLAS_PRIVATE_MUSHAF: ${{ needs.changes.outputs.private_mushaf == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: dist/

      # Playwright browser binaries (~300 MB for chromium) are expensive to
      # download. Cache them keyed by the lockfile — when @playwright/test
      # upgrades, pnpm-lock.yaml changes and the cache key rotates.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers (skipped on cache hit)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # CI runs the repo's React-only Playwright suite against the downloaded
      # production artifact. The offline spec is selected by tag in its own
      # command so service-worker coverage stays explicit.
      - name: Run Playwright suite (non-visual)
        run: env -u NO_COLOR pnpm exec playwright test --project=chromium --grep-invert @offline
        env:
          PLAYWRIGHT_USE_PREVIEW: '1'

      - name: Run Playwright offline suite
        run: env -u NO_COLOR pnpm exec playwright test --project=chromium --grep @offline
        env:
          PLAYWRIGHT_INCLUDE_OFFLINE: '1'
          PLAYWRIGHT_USE_PREVIEW: '1'

      - name: Run Playwright visual suite
        run: env -u NO_COLOR pnpm run visual
        env:
          PLAYWRIGHT_USE_PREVIEW: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            test-output/report/
            test-output/traces/
            test-output/visual-report/
            test-output/visual/
          retention-days: 7
          if-no-files-found: warn

  storybook:
    name: Storybook
    needs: changes
    if: needs.changes.outputs.storybook_relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browsers (skipped on cache hit)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit path)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm run build:storybook
      - run: pnpm run test:storybook

  ci-ok:
    name: CI OK
    needs: [changes, lint, test, docs-check, dataset-catalog, dataset-baseline, dataset-full, audit, build, lighthouse, e2e, storybook]
    # Run even when affected-change gates skip dataset or e2e jobs.
    # `always()` lets this job evaluate needs.* results; the step body then
    # fails if any upstream job failed or was cancelled.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Upstream job results:"
          printf '%s' "$NEEDS_JSON" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          if printf '%s' "$NEEDS_JSON" | jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' > /dev/null; then
            echo "All required CI gates passed (skipped jobs are allowed)."
          else
            echo "::error::One or more required CI gates failed or were cancelled."
            exit 1
          fi
