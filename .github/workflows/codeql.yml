name: CodeQL

on:
  # Schedule-only: CodeQL runs weekly as a background scan (catches newly-
  # disclosed issues in existing code). Intentionally not wired to push/PR
  # events — per-change scanning is overkill for a single-maintainer repo.
  # Run manually via workflow_dispatch when you want an immediate scan.
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

concurrency:
  group: codeql
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
