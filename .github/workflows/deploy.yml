name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, dev, staging]

permissions:
  contents: read
  actions: read
  deployments: write

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    concurrency:
      group: deploy-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    env:
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout at the verified SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download dist artifact from triggering CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
        with:
          version: 10.31.0
          run_install: false

      # Use pnpm dlx directly instead of cloudflare/wrangler-action, which is
      # still on Node 20 (no v4 released as of 2026-04-20). Direct invocation
      # keeps us on bumped action majors everywhere and uses the latest
      # wrangler each time — Cloudflare ships wrangler updates frequently.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm dlx wrangler@latest pages deploy dist \
            --project-name=quranatlas \
            --branch="${TARGET_BRANCH}" \
            --commit-hash="${TARGET_SHA}" \
            | tee deploy-output.txt
          # wrangler prints "Take a peek over at https://<id>.quranatlas.pages.dev"
          DEPLOY_URL=$(grep -Eo 'https://[a-f0-9]+\.quranatlas\.pages\.dev' deploy-output.txt | tail -1)
          echo "deployment-url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"

      - name: Write deploy summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "### Deployed ${TARGET_BRANCH}"
            echo ""
            echo "- **Commit:** \`${TARGET_SHA}\`"
            echo "- **Deployment URL:** ${DEPLOY_URL}"
            echo "- **Live at:**"
            case "${TARGET_BRANCH}" in
              main) echo "  - https://quranatlas.org" ;;
              dev) echo "  - https://dev.quranatlas.org" ;;
              staging) echo "  - https://staging.quranatlas.org" ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
