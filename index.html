<!doctype html>
<html lang="ar" dir="rtl" class="qa-theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      CSP baseline — also enforced via HTTP headers in public/_headers (Cloudflare Pages).
      frame-ancestors is intentionally omitted here (not supported in meta CSP).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'"
    />
    <meta name="description" content="Distraction-free Quran reader" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      KFGQPC font preload: must be first preload — resolves from SW precache in ~0ms after
      first visit. PUA-encoded quran.com corpus is unrenderable without this font.
    -->
    <link
      rel="preload"
      href="/fonts/kfgqpc-uthmani.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>QuranAtlas</title>
  </head>
  <body>
    <div id="app-shell">
      <header id="top-bar" role="banner">
        <span id="orientation-cue" aria-live="polite" aria-atomic="true"></span>
        <button id="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
          &#9776;
        </button>
      </header>

      <main id="main-content" role="main" tabindex="-1"></main>

      <nav id="nav-surface" role="navigation" aria-label="Quran navigation" hidden></nav>
    </div>

    <!--
      Live region for screen reader announcements (navigation jumps, mark saves, errors).
      Managed by src/a11y/announcer.js.
    -->
    <div
      id="announcer"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      style="
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      "
    ></div>

    <script type="module" src="/src/core/app.js"></script>
  </body>
</html>
