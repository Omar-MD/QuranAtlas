<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- CSP SHA-256 hash covers any inline scripts. To regenerate after changes:
       1. Open browser DevTools Console on the page
       2. Run: console.log(Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(document.querySelector('script')?.textContent || ''))).map(b => b.toString(16).padStart(2, '0')).join(''))
       3. Update the hash below with the output
       Note: Currently no inline scripts exist, this is a placeholder for future inline event handlers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-/AO8vAagk08SqUGxY96ci/dGyTDsuoetPOJYMn7sc+E='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QuranAtlas">
  <meta name="description" content="Distraction-free Quran reading PWA — read, reflect, remember.">
  <title>QuranAtlas</title>
  <link rel="preload" href="/src/styles/index.css" as="style">
  <!-- Preload the KFGQPC riwayah fonts so the first reader paint already has
       the Mushaf glyphs + Quranic tashkeel. Without preload, the browser only
       requests the font once it sees a `.qa-verse-arabic` element using the
       family — adding 200-500ms latency on slow mobile and triggering the
       Amiri fallback (still readable but not authentic). All three are
       preloaded so any boot-time `data-riwayah` choice is covered with a
       single round trip; total payload ≈260 KB woff2. -->
  <link rel="preload" href="/fonts/kfgqpc-hafs/hafs.18.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/kfgqpc-warsh/warsh.10.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/kfgqpc-qaloon/qaloon.10.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/src/styles/index.css">
</head>
<body>
  <!-- iOS WebKit deferred-load workaround. KFGQPC families are declared in
       CSS but only used by reader content mounted post-onboarding (Svelte
       router injects verses dynamically). iOS WebKit has an unresolved bug
       (Apple Dev Forum 671608) where @font-face fonts are never fetched if
       not referenced in the initial DOM. Even <link rel=preload> doesn't
       always trigger registration without an actual usage. The three
       off-screen elements below reference each KFGQPC family with an
       Arabic codepoint inside the @font-face unicode-range, forcing iOS to
       register + fetch all three on first paint — so any later riwayah
       switch already has the font cached and renders KFGQPC, not the
       Amiri fallback. Must NOT use display:none — that drops from the
       render tree and the bug returns. -->
  <div aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;font-size:1px;font-family:'KFGQPC Hafs',serif">ا</div>
  <div aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;font-size:1px;font-family:'KFGQPC Warsh',serif">ا</div>
  <div aria-hidden="true" style="position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;font-size:1px;font-family:'KFGQPC Qaloon',serif">ا</div>
  <div id="app"></div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
