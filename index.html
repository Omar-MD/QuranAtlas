<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- CSP SHA-256 hash covers any inline scripts. To regenerate after changes:
       1. Open browser DevTools Console on the page
       2. Run: console.log(Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(document.querySelector('script')?.textContent || ''))).map(b => b.toString(16).padStart(2, '0')).join(''))
       3. Update the hash below with the output
       Note: Currently no inline scripts exist, this is a placeholder for future inline event handlers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-/AO8vAagk08SqUGxY96ci/dGyTDsuoetPOJYMn7sc+E='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QuranAtlas">
  <meta name="description" content="Distraction-free Quran reading PWA — read, reflect, remember.">
  <title>QuranAtlas</title>
  <link rel="preload" href="/src/styles/index.css" as="style">
  <!-- Preload critical above-the-fold fonts — KFGQPC for verses (any of three
       riwayat is reachable at boot via the `data-riwayah` attribute) and
       Amiri Quran for the MarginHeader Arabic surah label. `crossorigin` is
       required for `as=font` per HTML spec — fonts always go through CORS
       in anonymous mode (CSS Fonts L4 §4.8.2 Font fetching requirements),
       and dropping the attribute would leave the preload unmatched even on
       same-origin. `type="font/woff2"` so the browser picks the right
       priority bucket without sniffing. -->
  <link rel="preload" href="/fonts/kfgqpc-hafs/hafs.18.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/kfgqpc-warsh/warsh.10.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/kfgqpc-qaloon/qaloon.10.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/amiri-quran/AmiriQuran-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <!-- @font-face declarations inlined in <head> per web.dev "Optimize web
       fonts" — early discovery without waiting for the external stylesheet
       parse. WOFF2 only (web.dev: "serve WOFF2 exclusively"); ttf fallback
       was dropped — every shipping mobile browser supports WOFF2 (iOS 10+,
       Chrome Android all). font-display: swap (CSS Fonts L4): minimal block
       period + infinite swap, so text is always visible during font fetch.
       unicode-range subsets per the @font-face script range so the browser
       can skip downloads when no character on the page falls inside. -->
  <style>
    @font-face {
      font-family: Newsreader;
      src: url('/fonts/newsreader/Newsreader-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: Newsreader;
      src: url('/fonts/newsreader/Newsreader-Italic.woff2') format('woff2');
      font-weight: 400;
      font-style: italic;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Geist Mono';
      src: url('/fonts/geist-mono/GeistMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Geist Mono';
      src: url('/fonts/geist-mono/GeistMono-Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: Amiri;
      src: url('/fonts/amiri/Amiri-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
    }
    @font-face {
      font-family: 'Amiri Quran';
      src: url('/fonts/amiri-quran/AmiriQuran-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
    }
    @font-face {
      font-family: 'KFGQPC Hafs';
      src: url('/fonts/kfgqpc-hafs/hafs.18.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
    }
    @font-face {
      font-family: 'KFGQPC Warsh';
      src: url('/fonts/kfgqpc-warsh/warsh.10.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
    }
    @font-face {
      font-family: 'KFGQPC Qaloon';
      src: url('/fonts/kfgqpc-qaloon/qaloon.10.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF;
    }
  </style>
  <link rel="stylesheet" href="/src/styles/index.css">
</head>
<body>
  <!-- iOS WebKit deferred-load workaround (Apple Dev Forum 671608).
       Round 1 used `font-size:1px` + far off-screen positioning — works on
       Android Blink and Playwright WebKit but Safari 17+ on real iPhones
       still skipped font registration: iOS defers paint for sub-pixel font
       and content positioned outside the viewport, so the @font-face never
       fires.  Round 2 uses visibility:hidden + zero box + a real 16px
       font-size + an Arabic codepoint inside @font-face unicode-range.
       visibility:hidden keeps the element in the render tree (display:none
       drops it and re-triggers the bug); width/height:0 + overflow:hidden
       keeps it layout-inert; font-size:16px ensures iOS WebKit treats the
       element as a real glyph render so it actually fetches the font. -->
  <div aria-hidden="true" style="visibility:hidden;position:absolute;width:0;height:0;overflow:hidden;font-size:16px;font-family:'KFGQPC Hafs',serif">ا</div>
  <div aria-hidden="true" style="visibility:hidden;position:absolute;width:0;height:0;overflow:hidden;font-size:16px;font-family:'KFGQPC Warsh',serif">ا</div>
  <div aria-hidden="true" style="visibility:hidden;position:absolute;width:0;height:0;overflow:hidden;font-size:16px;font-family:'KFGQPC Qaloon',serif">ا</div>
  <div id="app"></div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
