<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- CSP migrated to HTTP headers via public/_headers (Cloudflare Pages)
       per audit R-19 / R-32 / N24 (2026-04-29). The header form supports
       frame-ancestors (which meta-CSP cannot enforce) and lets us layer
       X-Frame-Options + X-Content-Type-Options + Permissions-Policy +
       Cross-Origin-* defences. Local Vite dev / Playwright preview run
       without a CSP — they're trusted environments behind localhost. -->
  <meta name="theme-color" content="#1d2a47">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="QuranAtlas">
  <meta name="description" content="Distraction-free Quran reading PWA — read, reflect, remember.">
  <title>QuranAtlas</title>
  <link rel="preload" href="/src/styles/index.css" as="style">
  <!-- No font preload: post 248b927 (KFGQPC default per Riwayah, drop font
       picker) the reader's primary Arabic faces are the three KFGQPC
       riwayat fonts. Active riwayah is settings-driven and unknown at
       HTML parse time, so preloading any one of them would still trigger
       "preloaded but not used" warnings for the other two. Amiri Quran
       is now only the small MarginHeader label face + cross-riwayah
       fallback — not preload-worthy. @font-face in src/styles/base.css
       fetches each face on demand. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/src/styles/index.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.ts"></script>
</body>
</html>
